<!-- Modal Dialog Audit Stream (Hardening/Tuning Execution) -->
<div id="audit-stream-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 9999; justify-content: center; align-items: center;">
    <div style="background: #0f172a; border: 1px solid var(--glass-border); border-radius: 20px; width: 90%; max-width: 800px; padding: 24px; box-shadow: 0 25px 60px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 id="audit-stream-modal-title" style="font-size: 16px; font-weight: 700; color: #fff; margin: 0;">Proses Sedang Berjalan...</h3>
            <button onclick="closeAuditStreamModal()" style="background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer;">✕</button>
        </div>
        <div id="audit-stream-terminal" style="height: 380px; background: #000; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); padding: 14px; font-family: 'Fira Code', monospace; font-size: 12px; overflow-y: auto; color: #e2e8f0; line-height: 1.6;">
        </div>
        <div style="display: flex; justify-content: flex-end;">
            <button class="btn btn-secondary" onclick="closeAuditStreamModal()">Tutup Jendela</button>
        </div>
    </div>
</div>
