<!-- Modal Dialog Add/Edit Preset -->
<div id="preset-modal-backdrop" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); z-index: 9999; justify-content: center; align-items: center;">
    <div style="background: #1e293b; border: 1px solid var(--glass-border); border-radius: 20px; width: 90%; max-width: 550px; padding: 30px; box-shadow: 0 25px 60px rgba(0,0,0,0.6);">
        <h3 id="preset-modal-title" style="font-size: 18px; margin-bottom: 20px; color: var(--text-main);">➕ Tambah Preset Server</h3>
        <input type="hidden" id="preset-modal-id">
        
        <div class="form-group">
            <label for="preset-modal-name">Nama Identitas Server / Sekolah</label>
            <input type="text" id="preset-modal-name" placeholder="Contoh: Server Sekolah (10.10.10.99)">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="preset-modal-ip">Alamat IP VPS Target</label>
                <input type="text" id="preset-modal-ip" placeholder="10.10.10.99">
            </div>
            <div class="form-group">
                <label for="preset-modal-user">User SSH</label>
                <input type="text" id="preset-modal-user" value="asepsuryadi">
            </div>
        </div>

        <div class="form-group">
            <label for="preset-modal-project">Target Proyek Deployment</label>
            <select id="preset-modal-project" onchange="toggleBuildModeField()">
                <option value="absenta">Project Absenta (Aplikasi Absensi Utama)</option>
                <option value="licensing">Server Lisensi (VPS Licensing System)</option>
                <option value="undangan">Project Undangan Digital (Digital Invitation Studio)</option>
                <option value="rekber">Project Rekening Bersama (B-Pay Gateway & Rekber Hub)</option>
            </select>
        </div>

        <div class="form-group" id="preset-buildmode-group" style="display: none;">
            <label for="preset-modal-buildmode">🔨 Mode Build Aplikasi</label>
            <select id="preset-modal-buildmode">
                <option value="remote">☁️ Remote Build — TypeScript dikompilasi langsung di VPS</option>
                <option value="local">🖥️ Local Build + SCP — Kompilasi di PC ini, upload dist/ ke VPS (untuk VPS spek kecil)</option>
                <option value="skip">🚀 Skip Build — Langsung upload folder dist/ eksisting (Instan 3-5 detik!)</option>
            </select>
            <small style="color: var(--text-muted); display: block; margin-top: 6px; line-height: 1.5;">
                💡 <strong>Skip Build</strong> mengunggah folder <code>dist/</code> lokal yang sudah Anda kompilasi manual di terminal secara instan.
            </small>
        </div>

        <div class="form-group" id="preset-obfuscate-group">
            <label for="preset-modal-obfuscate">🛡️ Proteksi Pengacakan Kode (Obfuscation / Enkripsi HKI)</label>
            <select id="preset-modal-obfuscate">
                <option value="N">⚡ Nonaktif (Off — Build Cepat untuk Trial & Error / Testing)</option>
                <option value="Y">🛡️ Aktif (On — Proteksi Enkripsi HKI untuk Release Produksi)</option>
            </select>
            <small style="color: var(--text-muted); display: block; margin-top: 6px; line-height: 1.5;">
                💡 Pilih <strong>Nonaktif</strong> saat masa pengujian/trial & error agar proses build berlangsung sangat cepat.
            </small>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="preset-modal-keychoice">Pilih SSH Key File</label>
                <select id="preset-modal-keychoice" onchange="togglePresetCustomKey()">
                    <option value="nginxonly.pem">🔑 Default (nginxonly.pem)</option>
                    <option value="ls-key.pem">🔑 LS Key (ls-key.pem)</option>
                    <option value="custom">📁 Pilih File Lain...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="preset-modal-sudopass">Password Sudo VPS <span style="color: var(--text-muted); font-size: 11px; font-weight: 400;">(opsional)</span></label>
                <input type="password" id="preset-modal-sudopass" placeholder="Kosongkan jika NOPASSWD sudo">
            </div>
        </div>

        <div class="form-group" id="preset-custom-key-group" style="display: none;">
            <label>File SSH Key (.pem)</label>
            <div style="display: flex; gap: 8px; align-items: center;">
                <input type="text" id="preset-modal-customkey" placeholder="Belum ada file dipilih..." readonly
                    style="flex: 1; cursor: default; background: rgba(15,23,42,0.6); color: var(--text-muted); font-family: 'Fira Code', monospace; font-size: 12px;">
                <button type="button" onclick="browseSSHKeyFile()"
                    style="white-space: nowrap; padding: 10px 16px; border-radius: 10px; border: 1px solid rgba(167,139,250,0.4); background: rgba(167,139,250,0.12); color: #a78bfa; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s;"
                    onmouseover="this.style.background='rgba(167,139,250,0.25)'" 
                    onmouseout="this.style.background='rgba(167,139,250,0.12)'"
                    id="browse-key-btn">
                    📂 Browse...
                </button>
            </div>
            <small style="color: var(--text-muted); display: block; margin-top: 6px;">
                Klik <strong>Browse</strong> untuk membuka dialog pilih file .pem dari komputer Anda.
            </small>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 25px;">
            <button class="btn btn-secondary" type="button" onclick="closePresetModal()">Batal</button>
            <button class="btn btn-primary" type="button" onclick="savePresetSubmit()">Simpan Preset</button>
        </div>
    </div>
</div>
